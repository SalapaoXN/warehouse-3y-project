<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1060" viewBox="0 0 1880 1060" role="img" aria-labelledby="title desc">
<title id="title">Silent Sting Star Schema ERD</title>
<desc id="desc">One row per patient id. Fact Bite Triage connects to date, location, animal source, bite position, symptom profile, and numeric triage dimensions.</desc>
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#20364a" flood-opacity=".10"/></filter>
  <style>
    text { font-family: Arial, "Segoe UI", sans-serif; fill: #273849; }
    .title { font-size: 32px; font-weight: 700; fill: #1b3650; }
    .subtitle { font-size: 17px; fill: #647487; }
    .legend { font-size: 14px; font-weight: 600; fill: #506477; }
    .table-head { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .field { font-size: 15px; }
    .type { font-size: 13px; fill: #758293; }
    .key-badge { font-size: 10px; font-weight: 700; text-anchor: middle; }
    .rel-label { font-size: 11px; font-weight: 600; fill: #728094; }
    .card { fill: #ffffff; stroke: #d8e0e8; stroke-width: 1.3; }
    .rel { fill: none; stroke: #a5afba; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="60" y="59" class="title">Silent Sting | Star Schema</text>
<text x="60" y="88" class="subtitle">Grain: one row per patient_id in the current snapshot</text>
<rect x="60" y="111" width="1760" height="42" rx="9" fill="#f0f4f8"/>
<rect x="78" y="121" width="34" height="22" rx="5" fill="#e7f0f8" stroke="#c5d7e7"/>
<text x="95" y="136" class="key-badge" fill="#326b97">PK</text><text x="121" y="136" class="legend">Primary key</text>
<rect x="244" y="121" width="34" height="22" rx="5" fill="#e6f3f1" stroke="#c3dfdb"/>
<text x="261" y="136" class="key-badge" fill="#287d76">FK</text><text x="287" y="136" class="legend">Foreign key</text>
<path d="M425 132 H477" class="rel"/><path d="M425 124 V140" class="rel"/>
<path d="M463 132 L477 124 M463 132 H477 M463 132 L477 140" class="rel"/>
<text x="489" y="136" class="legend">one row to many rows</text>

